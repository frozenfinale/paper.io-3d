    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#1a1008',
              fg: '#f7ecdc',

              primary: '#e8a13c',

    <style>
      body {
        background-color: theme('colors.bg');
        color: theme('colors.fg');
        font-family: theme('fontFamily.sans');

      .road-bg {
        background:
          radial-gradient(70% 40% at 50% 58%, rgba(255, 186, 90, 0.35) 0%, transparent 60%),

          linear-gradient(
            180deg,
            #2a1a3a 0%,
            #5c2f3a 26%,
            #a35434 44%,
            #d98b45 55%,
            #8a5227 62%,
            #4a2c14 78%,
            #24150a 100%
          );
        animation: drift 24s ease-in-out infinite alternate;
      }

      .road-veil {
        background: linear-gradient(
          180deg,
          rgba(42, 26, 12, 0.25) 0%,
          rgba(30, 18, 9, 0.6) 55%,
          rgba(20, 12, 6, 0.92) 100%

      .flicker-anim {

      .spray {

        letter-spacing: 0.06em;

    let luminInitialized = false;

    function goto(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if (screenId === 'home' || screenId === 'lumin') closeGame();
        if (screenId === 'games') renderGames();
        if (screenId === 'lumin' && !luminInitialized) {
            initLumin();
        }
    }

    function initLumin() {
        if (typeof Lumin !== 'undefined') {
            Lumin.init({
                container: '#lumin-games',
                theme: 'dark',
                onReady: () => console.log('LuminSDK is ready'),
                onError: (err) => console.error('LuminSDK error:', err),
            });
            luminInitialized = true;
        } else {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js';
            script.onload = () => {
                Lumin.init({
                    container: '#lumin-games',
                    theme: 'dark',
                    onReady: () => console.log('LuminSDK is ready'),
                    onError: (err) => console.error('LuminSDK error:', err),
                });
                luminInitialized = true;
            };
            document.body.appendChild(script);
        }
    }

    function renderGames() {
        const grid = document.getElementById('games-grid');
        const sortVal = document.getElementById('sort-select').value;
        
        let filtered = [...games];

        if (sortVal === 'popular') {
            filtered.sort((a, b) => (b.popular ? 1 : 0) - (a.popular ? 1 : 0));
        } else if (sortVal === 'rating') {
            filtered.sort((a, b) => b.rating - a.rating);
        } else if (sortVal === 'alphabetical') {
            filtered.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortVal === 'newest') {
            filtered.sort((a, b) => b.dateAdded - a.dateAdded);
        }

        grid.innerHTML = filtered.map(game => {
            const cursorClass = game.url 
                ? 'cursor-pointer' 
                : 'opacity-70 cursor-not-allowed';
            const clickHandler = game.url ? `onclick="playGame('${game.url}')"` : '';
            
            return `
            <div ${clickHandler} class="${game.span} ${cursorClass} group relative overflow-hidden rounded-2xl bg-card border border-border shadow-md transition-all hover:-translate-y-1 hover:border-primary hover:shadow-[0_0_20px_rgba(232,161,60,0.3)]">
                <img src="${game.image}" alt="${game.name}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 pointer-events-none" />
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent pointer-events-none"></div>
                <h2 class="absolute bottom-3 left-4 right-4 font-display uppercase tracking-wide text-white text-lg sm:text-xl drop-shadow-md leading-tight pointer-events-none">${game.name}</h2>
            </div>`;
        }).join('');
    }

    function playGame(url) {
        if (!url) return;
        const container = document.getElementById('player-container');
        const frame = document.getElementById('game-frame');
        frame.src = url;
        container.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeGame() {
        const container = document.getElementById('player-container');
        const frame = document.getElementById('game-frame');
        frame.src = '';
        container.classList.add('hidden');
    }

    function toggleFullscreen() {
        const frame = document.getElementById('game-frame');
        if (!document.fullscreenElement) {
            frame.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable fullscreen: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
        const btn = document.getElementById('fullscreen-btn');
        if (document.fullscreenElement) {
            btn.innerHTML = `<mat-icon class="text-[1rem]">fullscreen_exit</mat-icon> Exit`;
        } else {
            btn.innerHTML = `<mat-icon class="text-[1rem]">fullscreen</mat-icon> Fullscreen`;
        }
    });

    // Initialize
    renderGames();
